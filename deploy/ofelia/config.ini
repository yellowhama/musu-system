; ofelia — docker-native cron for the Musu ecosystem.
;
; Loaded by the scheduler-profile sidecar in docker-compose.yml. Jobs use
; `job-exec` which spawns the command inside an already-running container
; (here: musu-nurikun running `serve`). This keeps env/volumes consistent
; with the long-running daemon and avoids re-specifying secrets per job.
;
; Adjust the schedule + --limit to your inbox volume.

[job-exec "nurikun-watch"]
schedule = @every 10m
container = musu-nurikun
command = /usr/local/bin/musu-nurikun watch --project default --limit 25

; Disabled by default — uncomment + edit when you want autonomous campaigns.
; Note: `campaign send` is destructive (it actually emails subscribers).
; Triple-check the list_id, name, and that the subscribers really opted in
; before flipping this on.
;
; [job-exec "nurikun-campaign-weekly-digest"]
; schedule = 0 0 9 * * MON       ; cron(seconds): every Monday 09:00
; container = musu-nurikun
; command = /usr/local/bin/musu-nurikun campaign send --list 1 --name "Weekly Digest"
