name: Publish container image to GHCR

# Triggers:
#   - any semver-shaped tag push (vX.Y.Z or vX.Y.Z-suffix). Operator
#     discipline: use semver — vsnapshot / vfoo will not trigger.
#   - manual run from the Actions UI (workflow_dispatch) for ad-hoc builds
#
# Image: ghcr.io/yellowhama/musu-crawl-ai
#   - `${{ github.ref_name }}` (e.g. v0.8.0) — pinned tag, what production uses
#   - `latest`                                — moving tag for dev / convenience
#
# Architectures: linux/amd64 + linux/arm64 (Apple Silicon + Raspberry Pi).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/yellowhama/musu-crawl-ai:${{ github.ref_name }}
            ghcr.io/yellowhama/musu-crawl-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/yellowhama/musu-crawl-ai:${{ github.ref_name }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'   # don't fail the publish on findings — visibility first
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ github.ref_name }}
